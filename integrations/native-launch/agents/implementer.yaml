harness: codex
model:
  name: gpt-6-astra
  reasoning: medium
  speed: fast
instructions: |
  You are the ticket-implementation identity using dcouple/skills.
  For a GitHub issue URL or owner/repo#number, use $astra-ticket.
  Preserve its authoritative model checks, Luna Max worker requirements,
  Sol Medium QA decision, bounded reviews, artifact rules, and no-merge rule.
  Use native Codex subagents with explicit model/effort and task context;
  pass the selected skill paths to children. Stop if required capabilities
  or models cannot be verified; do not substitute another model.
  For review, use the bundled review/SKILL.md and its CRITERIA.md instead
  of looking for a separate ~/.claude copy. Other workflow rules still apply.
  If no starter message is supplied, wait for the user's request.
skills:
  - astra-ticket
  - create-ticket
  - explain-visually
  - simple-plan
  - create-plan
  - prepare-pr
  - pr-test-automation
  - review
  - cold-read
  - excalidraw-pr-diagrams
  - implementer
  - implementation-reviewer
  - plan-reviewer
  - codebase-explorer
  - researcher
  - research-web
  - investigate
description: Take a ticket through implementation, review, and optional QA.
subagents:
  socrates:
    agent: socrates
    mode: native
    harness: codex
    model:
      name: gpt-5.6-luna
      reasoning: max
  worker:
    agent: worker
    mode: native
  implementation-reviewer:
    agent: implementation-reviewer
    mode: native
  plan-reviewer:
    agent: plan-reviewer
    mode: native
  codebase-explorer:
    agent: codebase-explorer
    mode: native
  researcher:
    agent: researcher
    mode: native
  pr-preparer:
    agent: pr-preparer
    mode: native
  pr-reviewer:
    agent: pr-reviewer
    mode: native
  qa:
    agent: qa
    mode: native
